services:
  ctc:
    build: .
    image: create-teaching-content
    container_name: ctc
    ports:
      # Ueber das Tailscale-Netz erreichbar via <server>:8010 (keine Auth noetig,
      # da privat). Host-Port 8010, da 8000 bereits von kss-audio-workflow-backend
      # belegt ist. Fuer rein lokalen Zugriff ggf. auf 127.0.0.1:8010 binden.
      - "8010:8000"
    volumes:
      # Units bleiben ein Git-Repo auf dem Host -> Snapshots ueberleben Rebuilds.
      - ./units:/app/units
    environment:
      # Fuer Schritt 3 (LLM-Automatisierung, Claude-API):
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
