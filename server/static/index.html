<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>create-teaching-content</title>
<style>
  :root{
    --ink:#1f2933; --muted:#5b6b7a; --accent:#2c5282; --accent-soft:#eef3f8;
    --line:#d5dbe1; --ok:#2c7a7b; --warn:#9a3412; --bg:#f7fafc;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.5}
  header{background:var(--accent);color:#fff;padding:14px 20px}
  header h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.3px}
  header .status{font-size:12px;opacity:.85;margin-top:2px}
  .wrap{max-width:1000px;margin:0 auto;padding:16px;display:grid;
        grid-template-columns:260px 1fr;gap:16px}
  @media(max-width:760px){.wrap{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin:0 0 10px}
  h3{font-size:13px;color:var(--muted);margin:14px 0 6px}
  button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:6px;
         padding:8px 12px;cursor:pointer}
  button.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  button.sm{padding:4px 8px;font-size:12px}
  button:disabled{opacity:.5;cursor:default}
  input[type=text]{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;width:100%}
  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{padding:6px 8px;border-radius:6px;display:flex;justify-content:space-between;
             align-items:center;gap:8px}
  ul.units li{cursor:pointer}
  ul.units li.active{background:var(--accent-soft);font-weight:600}
  ul.files li{background:var(--bg);margin-bottom:4px;font-size:13px}
  textarea{width:100%;min-height:340px;font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
           font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .msg{font-size:13px;padding:8px 10px;border-radius:6px;margin-top:8px;white-space:pre-wrap}
  .msg.ok{background:#e6fffa;color:var(--ok)}
  .msg.err{background:#fff4ed;color:var(--warn)}
  .log{background:#1f2933;color:#e5e9ec;font-family:ui-monospace,monospace;font-size:12px;
       padding:10px;border-radius:6px;white-space:pre-wrap;margin-top:8px;max-height:220px;overflow:auto}
  label.chk{display:flex;gap:6px;align-items:center;font-size:13px}
  .muted{color:var(--muted);font-size:13px}
  a.pdf{color:var(--accent);text-decoration:none;font-size:13px}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>create-teaching-content</h1>
  <div class="status" id="status">…</div>
</header>

<div class="wrap">
  <!-- Sidebar: Units -->
  <div>
    <div class="card">
      <h2>Einheiten</h2>
      <ul class="list units" id="units"></ul>
      <h3>Neue Einheit</h3>
      <div class="row">
        <input type="text" id="newUnit" placeholder="z. B. 002-thema">
        <button class="sm" onclick="createUnit()">+</button>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <div class="card"><span class="muted">Wähle links eine Einheit oder lege eine neue an.</span></div>
  </div>
</div>

<template id="tpl-unit">
  <div class="card">
    <h2 id="u-title"></h2>
    <div class="row">
      <label class="chk"><input type="radio" name="variant" value="teacher" checked> Lehrer</label>
      <label class="chk"><input type="radio" name="variant" value="student"> Schüler</label>
      <label class="chk"><input type="checkbox" id="sol"> Lösungen</label>
      <button id="btn-build" onclick="buildUnit()">PDF bauen</button>
    </div>
    <div id="buildmsg"></div>
    <div id="pdfs"></div>
  </div>

  <div class="card">
    <h2>editorial.json</h2>
    <textarea id="editor" spellcheck="false"></textarea>
    <div class="row" style="margin-top:8px">
      <button onclick="saveEditorial()">Validieren &amp; speichern</button>
      <button class="ghost" onclick="loadEditorial()">Neu laden</button>
    </div>
    <div id="editmsg"></div>
  </div>

  <div class="card">
    <h2>Dateien</h2>
    <h3>sources/ &nbsp;<span class="muted">(Rohmaterial, LLM-Input)</span></h3>
    <ul class="list files" id="sources"></ul>
    <div class="row"><input type="file" id="up-sources" multiple>
      <button class="sm" onclick="uploadFiles('sources')">Hochladen</button></div>
    <h3>images/ &nbsp;<span class="muted">(Abbildungen)</span></h3>
    <ul class="list files" id="images"></ul>
    <div class="row"><input type="file" id="up-images" multiple>
      <button class="sm" onclick="uploadFiles('images')">Hochladen</button></div>
  </div>
</template>

<script>
let current = null;

async function j(url, opts){ const r = await fetch(url, opts); if(!r.ok && r.status>=500) throw new Error(await r.text()); return r; }

async function health(){
  try{ const h = await (await fetch('/api/health')).json();
    document.getElementById('status').textContent =
      h.typst ? ('Typst bereit — ' + h.typst_version) : 'ACHTUNG: Typst nicht gefunden';
  }catch(e){ document.getElementById('status').textContent = 'Server-Fehler'; }
}

async function loadUnits(){
  const units = await (await fetch('/api/units')).json();
  const ul = document.getElementById('units'); ul.innerHTML='';
  units.forEach(u=>{
    const li=document.createElement('li');
    li.textContent=u.name; li.className = (u.name===current?'active':'');
    li.onclick=()=>selectUnit(u.name); ul.appendChild(li);
  });
}

async function createUnit(){
  const name=document.getElementById('newUnit').value.trim(); if(!name) return;
  const r=await fetch('/api/units',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name})});
  if(r.ok){ document.getElementById('newUnit').value=''; await loadUnits(); selectUnit(name); }
  else alert((await r.json()).detail || 'Fehler');
}

async function selectUnit(name){
  current=name; await loadUnits();
  const tpl=document.getElementById('tpl-unit').content.cloneNode(true);
  const main=document.getElementById('main'); main.innerHTML=''; main.appendChild(tpl);
  document.getElementById('u-title').textContent=name;
  await loadEditorial(); await refreshDetail();
}

async function refreshDetail(){
  const d=await (await fetch(`/api/units/${current}`)).json();
  renderFiles('sources', d.sources); renderFiles('images', d.images);
  const box=document.getElementById('pdfs');
  box.innerHTML = d.pdfs.length ? ('<h3>PDFs</h3>' + d.pdfs.map(p=>
    `<div><a class="pdf" href="/api/units/${current}/pdf/${encodeURIComponent(p)}" target="_blank">↧ ${p}</a></div>`).join('')) : '';
}

function renderFiles(kind, files){
  const ul=document.getElementById(kind); if(!ul) return; ul.innerHTML='';
  files.forEach(f=>{
    const li=document.createElement('li');
    li.innerHTML=`<span>${f}</span>`;
    const b=document.createElement('button'); b.className='sm ghost'; b.textContent='×';
    b.onclick=()=>delFile(kind,f); li.appendChild(b); ul.appendChild(li);
  });
  if(!files.length){ const li=document.createElement('li'); li.className='muted';
    li.textContent='(leer)'; ul.appendChild(li); }
}

async function uploadFiles(kind){
  const inp=document.getElementById('up-'+kind); if(!inp.files.length) return;
  const fd=new FormData(); [...inp.files].forEach(f=>fd.append('files',f));
  await fetch(`/api/units/${current}/upload?kind=${kind}`,{method:'POST',body:fd});
  inp.value=''; refreshDetail();
}
async function delFile(kind,name){
  await fetch(`/api/units/${current}/file?kind=${kind}&name=${encodeURIComponent(name)}`,{method:'DELETE'});
  refreshDetail();
}

async function loadEditorial(){
  const t=await (await fetch(`/api/units/${current}/editorial`)).text();
  const el=document.getElementById('editor'); if(el){ try{ el.value=JSON.stringify(JSON.parse(t),null,2);}catch{ el.value=t; } }
  const m=document.getElementById('editmsg'); if(m) m.innerHTML='';
}

async function saveEditorial(){
  const m=document.getElementById('editmsg');
  let data; try{ data=JSON.parse(document.getElementById('editor').value); }
  catch(e){ m.className='msg err'; m.textContent='JSON-Syntaxfehler: '+e.message; return; }
  const r=await fetch(`/api/units/${current}/editorial`,{method:'PUT',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const res=await r.json();
  if(res.ok){ m.className='msg ok'; m.textContent='Gespeichert & schema-valide.'
      + (res.warnings&&res.warnings.length?('\n'+res.warnings.join('\n')):''); }
  else { m.className='msg err'; m.textContent='Schema-Fehler:\n- '+res.errors.join('\n- '); }
}

async function buildUnit(){
  const variant=document.querySelector('input[name=variant]:checked').value;
  const solutions=document.getElementById('sol').checked;
  const btn=document.getElementById('btn-build'); btn.disabled=true; btn.textContent='baut …';
  const m=document.getElementById('buildmsg');
  const r=await fetch(`/api/units/${current}/build`,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({variant,solutions})});
  const res=await r.json();
  if(res.ok){ m.innerHTML=`<div class="msg ok">Fertig: ${res.pdf}</div>`;
    if(res.log) m.innerHTML+=`<div class="log">${res.log}</div>`; }
  else { m.innerHTML=`<div class="msg err">Build fehlgeschlagen.</div><div class="log">${res.log||''}</div>`; }
  btn.disabled=false; btn.textContent='PDF bauen'; refreshDetail();
}

health(); loadUnits();
</script>
</body>
</html>
